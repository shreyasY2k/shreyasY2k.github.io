# Personal site: shreyasmk.fyi (static, no build step).
#
# Lives on the same OCI box as Praxis. TLS terminates upstream
# (Cloudflare -> OCI load balancer -> nginx:80), so this block listens on 80
# only and must not redirect to https itself (it would loop; Cloudflare's
# "Always Use HTTPS" handles that). Praxis's praxis.conf stays the
# default_server and keeps answering the load balancer's /healthz.
#
# INSTALL:
#   sudo cp deploy/nginx/shreyasmk.fyi.conf /etc/nginx/sites-available/shreyasmk.fyi.conf
#   sudo ln -sf /etc/nginx/sites-available/shreyasmk.fyi.conf /etc/nginx/sites-enabled/shreyasmk.fyi.conf
#   sudo mkdir -p /var/www/shreyasmk-fyi
#   sudo cp index.html Shreyas-Kaushik.pdf /var/www/shreyasmk-fyi/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen      80;
    listen      [::]:80;
    server_name shreyasmk.fyi www.shreyasmk.fyi;

    server_tokens off;
    root  /var/www/shreyasmk-fyi;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # www -> apex
    if ($host = www.shreyasmk.fyi) {
        return 301 https://shreyasmk.fyi$request_uri;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Old site linked the game at /contra; it lives on GitHub Pages.
    location = /contra {
        return 302 https://shreyasy2k.github.io/contra;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
